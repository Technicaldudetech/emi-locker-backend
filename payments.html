<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments - EMI Locker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header .left { display: flex; align-items: center; }
  .header a { color: #facc15; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #facc15; }
  .btn-export { background: #3b82f6; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .summary-card { background: #1e293b; padding: 12px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .summary-card h3 { font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
  .summary-card p { font-size: 18px; font-weight: bold; }
  .paid-amount { color: #22c55e; }
  .pending-amount { color: #ef4444; }

  .payment-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
  .payment-card h3 { font-size: 15px; margin-bottom: 5px; }
  .payment-card p { font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
  .amount-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .amount { font-size: 16px; font-weight: bold; color: #facc15; }
  .status-badge { padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; }
  .paid { background: #22c55e; color: #fff; }
  .pending { background: #f59e0b; color: #fff; }
  .overdue { background: #ef4444; color: #fff; }

  .btn-pay { width: 100%; padding: 8px; margin-top: 10px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-pay:hover { background: #16a34a; }
  .btn-paid-disabled { background: #475569; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="header">
    <div class="left">
      <a href="index.html">←</a>
      <h1>Payments History</h1>
    </div>
    <button onclick="exportPayments()" class="btn-export">📥 Export</button>
  </div>

  <div class="summary">
    <div class="summary-card">
      <h3>Total Collected</h3>
      <p class="paid-amount" id="totalCollected">₹0</p>
    </div>
    <div class="summary-card">
      <h3>Pending Amount</h3>
      <p class="pending-amount" id="totalPending">₹0</p>
    </div>
  </div>

  <div id="paymentsList"></div>

    <script>
    var container = document.getElementById("paymentsList");
    var payments = [];

    // 1. API se payments laao
    async function loadPayments() {
      try {
        var response = await fetch("http://localhost:5000/api/payments");
        payments = await response.json();
        renderPayments();
      } catch (error) {
        console.log(error);
        container.innerHTML = '<p class="no-result">❌ Server se connect nahi ho paaya.</p>';
      }
    }

    // 2. Render Payments
    function renderPayments() {
      container.innerHTML = "";
      var totalPaid = 0;
      var totalPending = 0;

      if (payments.length === 0) {
        container.innerHTML = '<p class="no-result">❌ Koi payment record nahi mila.</p>';
      }

      payments.forEach(function (p) {
        var badgeClass = p.status.toLowerCase();
        if (p.status === "Paid") totalPaid += p.amount;
        else totalPending += p.amount;

        var div = document.createElement("div");
        div.className = "payment-card";
        if (p.status === "Pending") div.style.borderLeftColor = "#f59e0b";
        if (p.status === "Overdue") div.style.borderLeftColor = "#ef4444";

        var btnHTML = "";
        if (p.status !== "Paid") {
          btnHTML = `<button class="btn-pay" onclick="markPaid('${p._id}')">✅ Mark as Paid</button>`;
        } else {
          btnHTML = `<button class="btn-pay btn-paid-disabled" disabled>✔️ Already Paid</button>`;
        }

        div.innerHTML = `
          <h3>💰 ${p.customer}</h3>
          <p>${p.device}</p>
          <p>Date: ${p.date}</p>
          <div class="amount-row">
            <span class="amount">₹${p.amount.toLocaleString()}</span>
            <span class="status-badge ${badgeClass}">${p.status}</span>
          </div>
          ${btnHTML}
        `;
        container.appendChild(div);
      });

      document.getElementById("totalCollected").innerHTML = "₹" + totalPaid.toLocaleString();
      document.getElementById("totalPending").innerHTML = "₹" + totalPending.toLocaleString();
    }

    // 3. Mark as Paid (API PUT)
    async function markPaid(id) {
      var p = payments.find(function (item) { return item._id === id; });
      if (!p) return;

      if (confirm("✅ Confirm payment received for " + p.customer + " (₹" + p.amount + ")?")) {
        try {
          await fetch(`http://localhost:5000/api/payments/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: "Paid" })
          });
          alert("✅ Payment marked as Paid in Database!");
          loadPayments(); // Refresh list
        } catch (error) {
          alert("❌ Error updating payment!");
        }
      }
    }

    // 4. Export Payments to CSV
    function exportPayments() {
      var csv = "Customer,Device,Amount,Date,Status\n";
      payments.forEach(function (p) {
        csv += `"${p.customer}","${p.device}","${p.amount}","${p.date}","${p.status}"\n`;
      });
      var blob = new Blob([csv], { type: "text/csv" });
      var url = window.URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "EMI_Locker_Payments.csv";
      a.click();
      window.URL.revokeObjectURL(url);
    }

    // Page load hote hi payments load karo
    loadPayments();
  </script>

</body>
</html>
