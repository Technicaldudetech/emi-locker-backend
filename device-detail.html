<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Detail - EMI Locker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header a { color: #facc15; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #facc15; }
  .device-info { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-top: 4px solid #ef4444; text-align: center; }
  .device-info .phone-icon { font-size: 50px; margin-bottom: 10px; }
  .device-info h2 { font-size: 18px; margin-bottom: 5px; }
  .device-info .status { display: inline-block; padding: 4px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; color: #fff; margin-top: 8px; }
  .details { background: #1e293b; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; }
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label { color: #94a3b8; }
  .detail-row .value { color: #fff; font-weight: bold; }
  .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .btn { padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-lock { background: #ef4444; color: #fff; }
  .btn-unlock { background: #22c55e; color: #fff; }
  .btn-full { width: 100%; background: #3b82f6; color: #fff; margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="header">
    <a href="devices.html">←</a>
    <h1>Device Details</h1>
  </div>

  <div class="device-info">
    <div class="phone-icon">📱</div>
    <h2 id="deviceName">Samsung Galaxy A14</h2>
    <p style="color:#94a3b8; font-size:12px;" id="customerName">Customer: Rahul Sharma</p>
    <span class="status" id="deviceStatus">🔒 LOCKED</span>
  </div>

  <div class="details">
    <div class="detail-row">
      <span class="label">IMEI Number</span>
      <span class="value" id="imei">356938035643809</span>
    </div>
    <div class="detail-row">
      <span class="label">Customer Name</span>
      <span class="value" id="customer2">Rahul Sharma</span>
    </div>
    <div class="detail-row">
      <span class="label">Phone Number</span>
      <span class="value">+91 98765 43210</span>
    </div>
    <div class="detail-row">
      <span class="label">Retailer</span>
      <span class="value">Sharma Mobile Point</span>
    </div>
    <div class="detail-row">
      <span class="label">Total Price</span>
      <span class="value">₹18,000</span>
    </div>
    <div class="detail-row">
      <span class="label">EMI Amount</span>
      <span class="value">₹2,500 / month</span>
    </div>
    <div class="detail-row">
      <span class="label">EMI Progress</span>
      <span class="value">5 / 12 Paid</span>
    </div>
    <div class="detail-row">
      <span class="label">Next Due Date</span>
      <span class="value">15 Oct 2026</span>
    </div>
  </div>

  <div class="action-buttons">
    <button class="btn btn-lock" id="lockBtn">🔒 LOCK DEVICE</button>
    <button class="btn btn-unlock" id="unlockBtn">🔓 UNLOCK DEVICE</button>
  </div>
  <button class="btn btn-full">📍 Live Location Track</button>
  <button class="btn btn-full" style="background:#f59e0b;">🔑 Change Password</button>

    <script>
    // URL se device ki ID nikaalo
    var params = new URLSearchParams(window.location.search);
    var deviceId = params.get("device");

    var statusEl = document.getElementById("deviceStatus");

    // 1. API se is device ka data laao (GET by ID)
    async function loadDevice() {
      try {
        var response = await fetch(`https://emi-locker-backend-1.onrender.com/api/devices/${deviceId}`);
        var dev = await response.json();

        // UI mein data daalo
        document.getElementById("deviceName").innerHTML = dev.name;
        document.getElementById("customerName").innerHTML = "Customer: " + dev.customer;
        document.getElementById("customer2").innerHTML = dev.customer;
        document.getElementById("imei").innerHTML = dev.imei;

        updateStatusUI(dev.status);
      } catch (error) {
        console.log(error);
        alert("❌ Device load nahi ho paaya!");
      }
    }

    // 2. Status UI update karo
    function updateStatusUI(status) {
      if (status === "ACTIVE") {
        statusEl.innerHTML = "🔓 UNLOCKED";
        statusEl.style.background = "#22c55e";
      } else {
        statusEl.innerHTML = "🔒 LOCKED";
        statusEl.style.background = "#ef4444";
      }
    }

    // 3. Lock Button (PUT API)
    document.getElementById("lockBtn").addEventListener("click", async function () {
      try {
        await fetch(`https://emi-locker-backend-1.onrender.com/api/devices/${deviceId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "LOCKED" })
        });
        updateStatusUI("LOCKED");
        alert("🔒 Device Locked Successfully in Database!");
      } catch (error) {
        alert("❌ Error!");
      }
    });

    // 4. Unlock Button (PUT API)
    document.getElementById("unlockBtn").addEventListener("click", async function () {
      try {
        await fetch(`https://emi-locker-backend-1.onrender.com/api/devices/${deviceId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "ACTIVE" })
        });
        updateStatusUI("ACTIVE");
        alert("🔓 Device Unlocked Successfully in Database!");
      } catch (error) {
        alert("❌ Error!");
      }
    });

    // Page load hote hi device load karo
    loadDevice();
  </script>

</body>
</html>
