<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Retailer</title>

<script>
  if (localStorage.getItem("isRetailerLoggedIn") !== "true") {
    window.location.href = "retailer-login.html";
  }
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header a { color: #22c55e; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #22c55e; }
  .profile-box { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; border-left: 4px solid #22c55e; }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: #22c55e; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; }
  .profile-box h3 { font-size: 15px; }
  .profile-box p { font-size: 12px; color: #94a3b8; }
  .section-title { color: #22c55e; font-size: 13px; margin: 15px 0 8px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; }
  .setting-item { background: #1e293b; padding: 14px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .setting-item .left { display: flex; align-items: center; gap: 10px; }
  .setting-item .value { font-size: 12px; color: #94a3b8; }
  .btn-logout { width: 100%; padding: 14px; background: #ef4444; color: #fff; font-weight: bold; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; }
  .version { text-align: center; color: #64748b; font-size: 11px; margin-top: 15px; }
</style>
</head>
<body>

  <div class="header">
    <a href="retailer-dashboard.html">←</a>
    <h1>Settings</h1>
  </div>

  <div class="profile-box">
    <div class="avatar">R</div>
    <div>
      <h3 id="shopName">Retailer Shop</h3>
      <p id="ownerName">Owner Name</p>
    </div>
  </div>

  <div class="section-title">👤 Account Details</div>

  <div class="setting-item">
    <div class="left"><span>🏪</span><span>Shop Name</span></div>
    <span class="value" id="shopVal">-</span>
  </div>

  <div class="setting-item">
    <div class="left"><span>👤</span><span>Owner Name</span></div>
    <span class="value" id="ownerVal">-</span>
  </div>

  <div class="setting-item">
    <div class="left"><span>📱</span><span>Phone Number</span></div>
    <span class="value" id="phoneVal">-</span>
  </div>

  <div class="section-title">🛟 Support</div>
  <div class="setting-item">
    <div class="left"><span>💬</span><span>Help & Support</span></div>
    <span class="value">›</span>
  </div>
  <div class="setting-item">
    <div class="left"><span>ℹ️</span><span>About EMI Locker</span></div>
    <span class="value">v1.0.0</span>
  </div>

  <button class="btn-logout" onclick="logout()">🚪 LOGOUT</button>
  <p class="version">© 2026 EMI Locker • Retailer Portal</p>

  <script>
    document.getElementById("shopName").innerHTML = localStorage.getItem("retailerShop") || "Retailer Shop";
    document.getElementById("ownerName").innerHTML = localStorage.getItem("retailerOwner") || "Owner";
    document.getElementById("shopVal").innerHTML = localStorage.getItem("retailerShop") || "-";
    document.getElementById("ownerVal").innerHTML = localStorage.getItem("retailerOwner") || "-";
    document.getElementById("phoneVal").innerHTML = localStorage.getItem("retailerPhone") || "-";

    function logout() {
      localStorage.removeItem("isRetailerLoggedIn");
      localStorage.removeItem("retailerId");
      localStorage.removeItem("retailerShop");
      localStorage.removeItem("retailerOwner");
      localStorage.removeItem("retailerPhone");
      window.location.href = "retailer-login.html";
    }
  </script>

</body>
</html>
