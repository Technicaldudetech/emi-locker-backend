<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retailer Dashboard - EMI Locker</title>

<script>
  // Agar retailer login nahi hai, toh login page par bhej do
  if (localStorage.getItem("isRetailerLoggedIn") !== "true") {
    window.location.href = "retailer-login.html";
  }
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #22c55e; }
  .header h1 { font-size: 16px; color: #22c55e; }
  .header p { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .btn-logout { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .card { background: #1e293b; padding: 15px; border-radius: 10px; border-left: 4px solid #22c55e; }
  .card h3 { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
  .card p { font-size: 20px; font-weight: bold; color: #fff; }
  .menu { background: #1e293b; border-radius: 10px; padding: 10px; }
  .menu-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item span { color: #22c55e; }
  a { text-decoration: none; color: inherit; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1 id="shopName">🏪 Retailer Dashboard</h1>
      <p id="ownerInfo">Welcome back!</p>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="stats">
    <div class="card">
      <h3>My Devices</h3>
      <p id="totalDevices">0</p>
    </div>
    <div class="card">
      <h3>Active Devices</h3>
      <p id="activeDevices">0</p>
    </div>
    <div class="card">
      <h3>Locked Devices</h3>
      <p id="lockedDevices">0</p>
    </div>
    <div class="card">
      <h3>Customers</h3>
      <p id="totalCustomers">0</p>
    </div>
  </div>

  <div class="menu">
    <a href="retailer-devices.html">
      <div class="menu-item">📱 My Devices <span>›</span></div>
    </a>
    <a href="retailer-add-device.html">
      <div class="menu-item">➕ Add New Customer <span>›</span></div>
    </a>
    <a href="retailer-payments.html">
      <div class="menu-item">💰 My Payments <span>›</span></div>
    </a>
    <a href="retailer-settings.html">
      <div class="menu-item">⚙️ Settings <span>›</span></div>
    </a>
  </div>

  <script>
    var retailerId = localStorage.getItem("retailerId");
    var shopName = localStorage.getItem("retailerShop");
    var ownerName = localStorage.getItem("retailerOwner");

    document.getElementById("shopName").innerHTML = "🏪 " + shopName;
    document.getElementById("ownerInfo").innerHTML = "Welcome, " + ownerName;

    async function loadStats() {
      try {
        var response = await fetch("https://emi-locker-backend-1.onrender.com/api/devices?retailerId=" + retailerId);
        var devices = await response.json();

        var active = devices.filter(d => d.status === "ACTIVE").length;
        var locked = devices.filter(d => d.status === "LOCKED").length;

        document.getElementById("totalDevices").innerHTML = devices.length;
        document.getElementById("activeDevices").innerHTML = active;
        document.getElementById("lockedDevices").innerHTML = locked;
        document.getElementById("totalCustomers").innerHTML = devices.length;
      } catch (error) {
        console.log(error);
      }
    }

    function logout() {
      localStorage.removeItem("isRetailerLoggedIn");
      localStorage.removeItem("retailerId");
      localStorage.removeItem("retailerShop");
      localStorage.removeItem("retailerOwner");
      window.location.href = "retailer-login.html";
    }

    loadStats();
  </script>

</body>
</html>
