<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Customer - Retailer</title>

<!-- Login check -->
<script>
  if (localStorage.getItem("isRetailerLoggedIn") !== "true") {
    window.location.href = "retailer-login.html";
  }
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header a { color: #22c55e; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #22c55e; }
  .form-box { background: #1e293b; padding: 20px; border-radius: 10px; border-top: 4px solid #22c55e; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 5px; }
  .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
  .input-group input:focus { border-color: #22c55e; }
  .btn-submit { width: 100%; padding: 14px; background: #22c55e; color: #fff; font-weight: bold; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
  .btn-submit:hover { background: #16a34a; }
</style>
</head>
<body>

  <div class="header">
    <a href="retailer-dashboard.html">←</a>
    <h1>Add New Customer</h1>
  </div>

  <div class="form-box">
    <div class="input-group">
      <label>Device / Phone Name</label>
      <input type="text" id="deviceName" placeholder="e.g. iPhone 14" required>
    </div>

    <div class="input-group">
      <label>Customer Name</label>
      <input type="text" id="customerName" placeholder="e.g. Rohan Singh" required>
    </div>

    <div class="input-group">
      <label>IMEI Number</label>
      <input type="text" id="imeiNumber" placeholder="15 digit IMEI" required>
    </div>

    <div class="input-group">
      <label>Phone Number</label>
      <input type="text" id="phoneNumber" placeholder="+91 XXXXX XXXXX">
    </div>

    <div class="input-group">
      <label>Total Price (₹)</label>
      <input type="number" id="totalPrice" placeholder="e.g. 18000">
    </div>

    <div class="input-group">
      <label>EMI Amount per Month (₹)</label>
      <input type="number" id="emiAmount" placeholder="e.g. 2500">
    </div>

    <button class="btn-submit" id="saveBtn">💾 SAVE CUSTOMER</button>
  </div>

  <script>
    document.getElementById("saveBtn").addEventListener("click", async function () {
      var name = document.getElementById("deviceName").value;
      var customer = document.getElementById("customerName").value;
      var imei = document.getElementById("imeiNumber").value;

      // Validation
      if (name === "" || customer === "" || imei === "") {
        alert("❌ Please fill Device Name, Customer Name, and IMEI!");
        return;
      }

      // Retailer ID localStorage se lo
      var retailerId = localStorage.getItem("retailerId");
      if (!retailerId) {
        alert("❌ Retailer ID not found! Please login again.");
        return;
      }

      var newDevice = {
        name: name,
        customer: customer,
        imei: imei,
        status: "ACTIVE",
        retailerId: retailerId   // Ye device is retailer se link ho jayega
      };

      try {
        var response = await fetch("https://emi-locker-backend-1.onrender.com/api/devices", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(newDevice)
        });

        if (response.ok) {
          alert("✅ Customer added successfully!\n\n" + name);
          window.location.href = "retailer-devices.html";
        } else {
          alert("❌ Data save nahi ho paaya. Server error.");
        }
      } catch (error) {
        console.log(error);
        alert("❌ Server se connect nahi ho paaya!");
      }
    });
  </script>

</body>
</html>
