<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Locker - Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header h1 { font-size: 18px; color: #facc15; }
  .header span { font-size: 12px; color: #94a3b8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .card { background: #1e293b; padding: 15px; border-radius: 10px; border-left: 4px solid #facc15; }
  .card h3 { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
  .card p { font-size: 20px; font-weight: bold; color: #fff; }
  .menu { background: #1e293b; border-radius: 10px; padding: 10px; }
  .menu-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item span { color: #facc15; }
  a { text-decoration: none; color: inherit; }
</style>
</head>
<body>

  <div class="header">
    <h1>EMI LOCKER</h1>
    <span>Admin Panel</span>
  </div>

  <div class="stats">
    <div class="card">
      <h3>Total Devices</h3>
      <p>12,642</p>
    </div>
    <div class="card">
      <h3>Active Devices</h3>
      <p>10,987</p>
    </div>
    <div class="card">
      <h3>Locked Devices</h3>
      <p>1,655</p>
    </div>
    <div class="card">
      <h3>Total Revenue</h3>
      <p>₹24,50,000</p>
    </div>
  </div>

  <div class="menu">
    <a href="devices.html">
      <div class="menu-item">Devices <span>›</span></div>
    </a>
    <a href="retailers.html">
      <div class="menu-item">Retailers <span>›</span></div>
    </a>
    <a href="payments.html">
      <div class="menu-item">Payments <span>›</span></div>
    </a>
    <a href="reports.html">
      <div class="menu-item">Reports <span>›</span></div>
    </a>
    <a href="settings.html">
      <div class="menu-item">Settings <span>›</span></div>
    </a>
  </div>

</body>
</html>
