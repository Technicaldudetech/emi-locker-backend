<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Devices - Retailer</title>

<script>
  if (localStorage.getItem("isRetailerLoggedIn") !== "true") {
    window.location.href = "retailer-login.html";
  }
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header .left { display: flex; align-items: center; }
  .header a { color: #22c55e; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #22c55e; }
  .btn-add { background: #22c55e; color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
  .search-box { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
  .search-box:focus { border-color: #22c55e; }
  .device-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #22c55e; }
  .device-card.locked { border-left-color: #ef4444; }
  .device-card h3 { font-size: 15px; margin-bottom: 5px; }
  .device-card p { font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
  .status { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; margin-top: 5px; }
  .active { background: #22c55e; color: #fff; }
  .locked { background: #ef4444; color: #fff; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .btn-lock, .btn-unlock { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-lock { background: #ef4444; color: #fff; }
  .btn-unlock { background: #22c55e; color: #fff; }
  .no-result { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 30px; }
</style>
</head>
<body>

  <div class="header">
    <div class="left">
      <a href="retailer-dashboard.html">←</a>
      <h1>My Devices</h1>
    </div>
    <a href="retailer-add-device.html" class="btn-add">➕ Add</a>
  </div>

  <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by Device, Customer or IMEI...">

  <div id="deviceList"></div>

  <script>
    var container = document.getElementById("deviceList");
    var allDevices = [];
    var retailerId = localStorage.getItem("retailerId");

    async function loadDevices() {
      try {
        var response = await fetch("https://emi-locker-backend-1.onrender.com/api/devices?retailerId=" + retailerId);
        allDevices = await response.json();
        renderDevices(allDevices);
      } catch (error) {
        container.innerHTML = '<p class="no-result">❌ Server se connect nahi ho paaya.</p>';
      }
    }

    function renderDevices(list) {
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = '<p class="no-result">❌ Abhi tak koi device add nahi kiya.</p>';
        return;
      }
      list.forEach(function (dev) {
        var isLocked = (dev.status === "LOCKED");
        var card = document.createElement("div");
        card.className = "device-card" + (isLocked ? " locked" : "");
        card.innerHTML = `
          <h3>📱 ${dev.name}</h3>
          <p>Customer: ${dev.customer}</p>
          <p>IMEI: ${dev.imei}</p>
          <span class="status ${isLocked ? 'locked' : 'active'}">${isLocked ? 'Locked' : 'Active'}</span>
          <div class="actions">
            <button class="btn-lock" onclick="setStatus('${dev._id}', 'LOCKED')">🔒 Lock</button>
            <button class="btn-unlock" onclick="setStatus('${dev._id}', 'ACTIVE')">🔓 Unlock</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function setStatus(id, status) {
      try {
        await fetch(`https://emi-locker-backend-1.onrender.com/api/devices/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: status })
        });
        alert(status === "LOCKED" ? "🔒 Device Locked!" : "🔓 Device Unlocked!");
        loadDevices();
      } catch (error) {
        alert("❌ Error!");
      }
    }

    document.getElementById("searchInput").addEventListener("input", function (e) {
      var text = e.target.value.toLowerCase();
      var filtered = allDevices.filter(d =>
        d.name.toLowerCase().includes(text) ||
        d.customer.toLowerCase().includes(text) ||
        d.imei.includes(text)
      );
      renderDevices(filtered);
    });

    loadDevices();
  </script>

</body>
</html>
